name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libdbus (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev dbus libffi-dev g++-mingw-w64-x86-64 gcc-riscv64-unknown-elf

      - run: npm ci

      - run: npm test

      - run: npm run test:loader

      - name: Native Objective-C backend
        if: runner.os == 'macOS'
        run: npm run test:apple-native

      - name: iOS cross-compile
        if: runner.os == 'macOS'
        run: npm run test:ios

      - name: iOS simulator runtime test
        if: runner.os == 'macOS'
        run: npm run test:ios-sim

      - name: JNI host JVM test
        if: runner.os != 'Windows'
        run: npm run test:jni-native

      - name: Embedded registry and Cortex-M cross-compile
        if: runner.os != 'Windows'
        run: npm run test:embedded-native

      - name: Generic native call test
        if: runner.os == 'Linux'
        run: npm run test:ffi-native

      - name: Windows native cross-compile
        if: runner.os == 'Linux'
        run: npm run test:windows-native

      - name: D-Bus session bus test
        if: runner.os == 'Linux'
        run: npm run test:dbus-native

      - name: D-Bus TypeScript native test
        if: runner.os == 'Linux'
        run: npm run test:dbus-ts-native

      - name: Codegen compile check
        if: runner.os != 'Windows'
        run: npm run test:codegen-native

      - name: Android NDK cross-compile
        if: runner.os == 'Linux'
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ ! -d "$ANDROID_HOME/ndk" ]; then
            echo "No Android NDK on this runner; skipping."
            exit 0
          fi
          npm run test:android-native


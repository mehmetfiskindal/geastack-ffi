name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm test

      - run: npm run test:loader

      - name: Native Objective-C backend
        if: runner.os == 'macOS'
        run: npm run test:apple-native

      - name: iOS cross-compile
        if: runner.os == 'macOS'
        run: npm run test:ios

      - name: JNI host JVM test
        if: runner.os != 'Windows'
        run: npm run test:jni-native

      - name: Android NDK cross-compile
        if: runner.os == 'Linux'
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ ! -d "$ANDROID_HOME/ndk" ]; then
            echo "No Android NDK on this runner; skipping."
            exit 0
          fi
          npm run test:android-native

